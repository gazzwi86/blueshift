[project]
name = "blueshift"
version = "0.1.0"
description = "Blueshift - Autonomous coding agent harness using Claude SDK"
requires-python = "==3.12.*"
dependencies = [
    "claude-code-sdk>=0.0.25",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
evaluation = [
    "deepeval>=0.21.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"generations/**/*.py" = ["ALL"]  # Skip generated code

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
target-version = ["py312"]
line-length = 100
extend-exclude = "generations/"

[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Async support
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow tests

# Coverage
addopts =
    -v
    --tb=short
    -ra

# Ignore generated code
norecursedirs =
    generations
    .venv
    __pycache__
    .git
    .terraform

# Filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
